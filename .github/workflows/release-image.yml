# Publishes the container image to GHCR after a release is created.
#
# It does not compile anything. The release that just finished already built a
# Linux binary for each CPU architecture, so this downloads those and copies
# them into the image. Compiling again here would risk the image and the
# download being subtly different builds.
#
# There are two jobs:
#
#   build     runs twice, once on an Intel runner and once on an ARM runner,
#             each producing an image for its own architecture
#   manifest  ties the two together under one tag, so `docker pull` gets the
#             right one automatically
#
# The ARM image is built on a real ARM machine (GitHub gives public repos free
# ARM runners), so it is actually run on the hardware it targets rather than
# emulated.
name: Release image

# Runs when the "Release" workflow finishes, not when the release appears.
#
# The obvious trigger would be `on: release: [published]`, and it does not work.
# The release is created by the Release workflow using the token GitHub hands
# every workflow automatically, and GitHub refuses to start new workflows from
# anything that token did — it is how they stop a workflow from endlessly
# triggering itself. So no release event is ever delivered and this file would
# simply never run. Waiting for the Release workflow to finish gets us the same
# moment by a route that does fire.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  # Also runnable by hand from the Actions tab, for retrying a failed push to
  # GHCR without creating a whole new release.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build the image from (e.g. v0.1.0)
        required: true
        type: string

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    # Skip unless there is something worth building an image from: a Release run
    # that actually succeeded, and that came from a pushed tag rather than from
    # a pull request (the Release workflow runs on those too, as a dry run).
    # If this job is skipped the `manifest` job below is skipped with it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      # Works whether this was started by hand or by the Release workflow
      # finishing. In the second case the tag name usually arrives in
      # `head_branch`; when it does not, we find it by looking for the tag that
      # points at the commit that was built. `version` is the tag without the
      # leading "v", which is what the image gets tagged with: v0.1.0 -> 0.1.0.
      - name: Work out which tag we are building
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${RUN_BRANCH:-}}"
          if [ -z "$tag" ] || ! gh release view "$tag" >/dev/null 2>&1; then
            tag=$(gh api "repos/$GH_REPO/tags" --paginate \
                    -q ".[] | select(.commit.sha==\"$RUN_SHA\") | .name" | head -1)
          fi
          if [ -z "$tag" ]; then
            echo "::error::could not work out which tag to build an image for"
            exit 1
          fi
          # There is nothing to build from unless the release actually exists.
          gh release view "$tag" >/dev/null
          echo "building from $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Every release includes a `dist-manifest.json` listing what it published
      # and for which platform. We look the filename up there rather than
      # hardcoding it, so that if the release tool ever renames its archives
      # this fails loudly instead of quietly building no image.
      - name: Download the binary this release published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ctx
          gh release download "$TAG" --pattern dist-manifest.json --dir .
          archive=$(jq -r --arg t '${{ matrix.target }}' '
            .artifacts | to_entries
            | map(select(.value.kind == "executable-zip"
                         and (.value.target_triples // [] | index($t))))
            | .[0].key // empty' dist-manifest.json)
          test -n "$archive" || {
            echo "::error::dist-manifest.json has no executable-zip for ${{ matrix.target }}"
            exit 1
          }
          echo "archive: $archive"
          gh release download "$TAG" --pattern "$archive" --dir .
          tar -xf "$archive" --strip-components=1 -C ctx --wildcards '*/lanyard'
          chmod +x ctx/lanyard
          ./ctx/lanyard --version

      - name: Log in to GHCR
        run: |
          echo '${{ github.token }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # Three flags here are not arbitrary, and they depend on each other:
      #
      # `--driver docker-container` — the builder Docker uses by default cannot
      # upload an image without giving it a tag. We do not want a tag yet: this
      # is only half of the final image, and the `manifest` job below is what
      # names it. So we upload it unnamed and remember its ID (its "digest").
      #
      # `oci-mediatypes=false` — writes the image in Docker's older format,
      # which supports HEALTHCHECK. Our image has no shell in it, so the health
      # check is the only way anything can tell whether the container is up.
      #
      # `--provenance=false --sbom=false` — turns off the build-signature and
      # bill-of-materials extras the builder adds by default. They are only
      # expressible in the newer format, so leaving them on contradicts the line
      # above and the build fails outright with "cannot export attestations with
      # oci-mediatypes=false". Turning them off is what we wanted anyway: each
      # one adds an extra entry to the published image that shows up as an
      # `unknown/unknown` platform, which is noise in `podman manifest inspect`
      # and would break the two-architectures check in the next job.
      - name: Build the image and upload it
        id: push
        run: |
          set -euo pipefail
          docker buildx create --driver docker-container --use --name lanyard-builder
          docker buildx build ctx \
            --file Dockerfile \
            --build-arg BINARY_STAGE=prebuilt \
            --platform '${{ matrix.platform }}' \
            --provenance=false \
            --sbom=false \
            --metadata-file metadata.json \
            --output "type=image,name=$IMAGE,oci-mediatypes=false,push-by-digest=true,name-canonical=true,push=true"
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          test -n "$digest" && test "$digest" != null
          echo "$digest" > "digest-$(echo '${{ matrix.platform }}' | tr / -)"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: digest-*
          retention-days: 1

  # Both images are now uploaded but unnamed. This job creates the tag that
  # points at both of them at once, so `docker pull ghcr.io/robap/lanyard:0.1.0`
  # gets the Intel image on an Intel machine and the ARM image on a Mac.
  manifest:
    name: One tag, two architectures
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Works whether this was started by hand or by the Release workflow
      # finishing. In the second case the tag name usually arrives in
      # `head_branch`; when it does not, we find it by looking for the tag that
      # points at the commit that was built. `version` is the tag without the
      # leading "v", which is what the image gets tagged with: v0.1.0 -> 0.1.0.
      - name: Work out which tag we are building
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${RUN_BRANCH:-}}"
          if [ -z "$tag" ] || ! gh release view "$tag" >/dev/null 2>&1; then
            tag=$(gh api "repos/$GH_REPO/tags" --paginate \
                    -q ".[] | select(.commit.sha==\"$RUN_SHA\") | .name" | head -1)
          fi
          if [ -z "$tag" ]; then
            echo "::error::could not work out which tag to build an image for"
            exit 1
          fi
          # There is nothing to build from unless the release actually exists.
          gh release view "$tag" >/dev/null
          echo "building from $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # A prerelease (v0.1.0-rc.1) is for testing the pipeline, not for users.
      # It still gets its own version tag so we can pull and check it, but it
      # must never become `:latest`, because that is what people get when they
      # type `docker run ghcr.io/robap/lanyard` with no tag.
      - name: Is this a prerelease?
        id: kind
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pre=$(gh release view "$TAG" --json isPrerelease -q .isPrerelease)
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests

      - name: Log in to GHCR
        run: |
          echo '${{ github.token }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # `imagetools create` is what makes one tag point at several images.
      # The check that there are exactly two guards against a half-finished
      # release where one architecture failed to build.
      - name: Point one tag at both images
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          PRERELEASE: ${{ steps.kind.outputs.prerelease }}
        run: |
          set -euo pipefail
          tags=(-t "$IMAGE:$VERSION")
          if [ "$PRERELEASE" = false ]; then tags+=(-t "$IMAGE:latest"); fi
          refs=()
          for f in digests/digest-*; do refs+=("$IMAGE@$(cat "$f")"); done
          test "${#refs[@]}" -eq 2 || { echo "::error::expected 2 digests, got ${#refs[@]}"; exit 1; }
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
