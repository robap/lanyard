[package]
name = "lanyard-cli"
version = "0.1.0-rc.1"
edition = "2021"
description = "A local OIDC provider with nothing to configure"
license = "MIT"
repository = "https://github.com/robap/lanyard"
# The Homebrew formula carries a homepage; without one `dist` warns and the tap
# ships a formula with a blank field.
homepage = "https://github.com/robap/lanyard"
# **`web/dist/` ships; nothing else under `web/` does.** The built UI is what
# `rust-embed` compiles in, so a `cargo install` with no `zero` on PATH needs
# it — and CI's `cargo package --locked` job is the check that it is there:
# it builds the packaged crate, where a missing bundle is a `rust-embed` error
# rather than a smaller binary. Nothing here publishes to crates.io.
# The zero *sources*, the spikes and the docs are how the repository works, not
# how the crate builds, and they are three quarters of the package by file
# count. `exclude` rather than `include` so a new source file is shipped by
# default and dropping one is the deliberate act.
exclude = [
    "/docs",
    "/spikes",
    "/scripts",
    "/zero.toml",
    "/web/src",
    "/web/styles",
    "/web/index.html",
    "/web/tsconfig.json",
    "/web/AGENTS.md",
    "/web/.gitignore",
    "/.claude",
    # How the repository is built and released, not how the crate is. CI's own
    # `cargo package` job asserts it stays out.
    "/.github",
]

[lib]
name = "lanyard_cli"
path = "src/lib.rs"

[[bin]]
name = "lanyard"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RUSTSEC-2023-0071 (Marvin) is reported against `rsa`. It is a timing
# side-channel in *decryption*; lanyard only ever signs, and the default signing
# key is published in this repo on purpose. Not a finding for this crate.
rsa = "0.9"
# Pinned to 0.10 on purpose: rsa 0.9 depends on `sha2 ^0.10` digest traits and
# will not accept sha2 0.11's.
# `oid` carries the DigestInfo OID that PKCS#1 v1.5 signatures embed.
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# The loopback check on `redirect_uri` is lanyard's single security boundary, so
# it gets a real URL parser rather than a hand-rolled one. Already in the lock
# via `reqwest`, so it costs nothing — and its IDNA normalization is what makes a
# Cyrillic homograph of `localhost` punycode to `xn--…` and fail the comparison.
url = "2"
serde_norway = "0.9.42"
serde_urlencoded = "0.7"
# The CLI performs a real `client_credentials` grant rather than signing locally,
# so `reqwest` is a runtime dependency now. `default-features = false` keeps a TLS
# stack out of the binary: `LANYARD_URL` is http-only until HTTPS lands post-v1.
# `"stream"` is Phase 6's addition: `lanyard logs` reads a response body as it
# arrives, and `Response::bytes_stream()` does not exist without it.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "stream"] }
# The committed `web/dist/` compiled into the binary. Reads from disk in debug
# builds and embeds in release, so the UI loop is `zero build && cargo run` with
# no second process — and `zero` is never on lanyard's build path.
rust-embed = "8"
# One `async_stream::stream!` builds the event stream's already-encoded frames,
# so SSE and ndjson are two content types over one code path rather than two
# paths that could drift about what they emit.
async-stream = "0.3"

[dev-dependencies]
tempfile = "3.27.0"
url = "2"
sha2 = { version = "0.10", features = ["oid"] }
# The browser-flow tests need a cookie jar, and the binary does not: the feature
# is added here so `lanyard` itself never links a cookie store it has no use for.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "cookies", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

# **The profile the downloaded binary is built with.** Thin LTO and no symbols:
# an artifact somebody waits on a network for should be the small one.
[profile.dist]
inherits = "release"
lto = "thin"
strip = "symbols"

# **`brew install robap/tap/lanyard`, not `lanyard-cli`.** The crate keeps the
# name reserved for it on crates.io; the thing a person installs is called what
# the binary is called. `dist` names the formula after the package otherwise,
# and the tap is regenerated on every release, so this is the only place it can
# be said.
[package.metadata.dist]
formula = "lanyard"
