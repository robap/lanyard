<!doctype html>
<meta charset="utf-8">
<title>node-spa — a public client against lanyard</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 3rem auto; max-width: 40rem; padding: 0 1rem; }
  pre { background: #f4f5f7; padding: 1rem; border-radius: 8px; overflow-x: auto; }
  button { font: inherit; padding: .5rem 1rem; }
</style>
<h1>node-spa</h1>
<p>
  A public client — <strong>no <code>client_secret</code> anywhere</strong> — using
  <code>oidc-client-ts</code> against lanyard. Nothing was registered with lanyard first;
  the only lanyard-side setup was starting it.
</p>
<p><button id="login">Sign in</button> <button id="logout">Sign out</button></p>
<p id="email"></p>
<pre id="out">not signed in</pre>

<!-- Vendored, not fetched. The bundle is committed next to this file so the
     spike runs with no network and no `npm install`, and so nothing in this
     repository's login path reaches a CDN. -->
<script src="./vendor/oidc-client-ts.min.js"></script>
<script>
  const settings = {
    authority: 'http://127.0.0.1:9500/oidc',
    client_id: 'node-spa',
    redirect_uri: 'http://localhost:5173/',
    post_logout_redirect_uri: 'http://localhost:5173/',
    response_type: 'code',
    scope: 'openid email profile',
    // oidc-client-ts sends S256 by default for a public client; named here so
    // the thing criterion 2 is about is visible in the source.
    userStore: new oidc.WebStorageStateStore({ store: window.localStorage }),
  }
  const mgr = new oidc.UserManager(settings)

  const out = document.getElementById('out')
  const emailLine = document.getElementById('email')

  function show(user) {
    if (!user) { out.textContent = 'not signed in'; emailLine.textContent = ''; return }
    emailLine.innerHTML = 'email: <strong>' + (user.profile.email ?? '(no email claim)') + '</strong>'
    out.textContent = JSON.stringify(user.profile, null, 2)
  }

  document.getElementById('login').onclick = () => mgr.signinRedirect()
  document.getElementById('logout').onclick = async () => {
    await mgr.removeUser()
    show(null)
  }

  ;(async () => {
    if (window.location.search.includes('code=')) {
      try {
        const user = await mgr.signinRedirectCallback()
        window.history.replaceState({}, '', '/')
        show(user)
        return
      } catch (err) {
        out.textContent = 'FAILED: ' + err
        return
      }
    }
    show(await mgr.getUser())
  })()
</script>
