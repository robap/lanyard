<!doctype html>
<meta charset="utf-8">
<title>node-spa — a public client against lanyard</title>
<div id="page">loading…</div>

<!-- Vendored, not fetched. The bundle is committed next to this file so the
     spike runs with no network and no `npm install`, and so nothing in this
     repository's login path reaches a CDN. -->
<script src="./vendor/oidc-client-ts.min.js"></script>
<script>
  // **One page, two renews.** `?renew=iframe` drops `offline_access` and
  // nothing else, because that one missing scope *is* the difference: holding a
  // refresh token, `automaticSilentRenew` spends it at `POST /oidc/token` and
  // never redirects (Phase 5); holding none, it opens a hidden iframe at
  // `/authorize?prompt=none` (Phase 9). Two mechanisms, one `if`.
  //
  // The toggle is URL-only. `spikes/shared/page.html` is byte-identical across
  // three stacks by design, so a checkbox on it is off the table.
  const iframeRenew = new URLSearchParams(window.location.search).get('renew') === 'iframe'

  // The toggle rides on both redirect URIs so it survives the round trip
  // through lanyard — a callback that came back without it would rebuild this
  // manager in the other mode. lanyard appends `code`/`state` to whatever query
  // is already there, and its one rejection is about the *host*, so a
  // redirect_uri with a query string needs no registration either (north star 1).
  const here = 'http://localhost:5173/' + (iframeRenew ? '?renew=iframe' : '')

  const settings = {
    authority: 'http://127.0.0.1:9500/oidc',
    client_id: 'node-spa',
    redirect_uri: here,
    post_logout_redirect_uri: here,
    // **Named, because the default is a trap.** `silent_redirect_uri` defaults
    // to `redirect_uri`, and this one is `/` — whose script completes a
    // *redirect* login the moment it sees `code=`. Inside the renew iframe that
    // is the wrong callback for the state entry the silent flow wrote, and it
    // fails. `silent-callback.html` is the page every real SPA ships for this.
    silent_redirect_uri: 'http://localhost:5173/silent-callback.html',
    response_type: 'code',
    // `offline_access` is what asks lanyard for a refresh token, exactly as
    // `openid` is what asks for an ID token. Without it this SPA gets none and
    // `automaticSilentRenew` falls back to the iframe path.
    scope: 'openid email profile' + (iframeRenew ? '' : ' offline_access'),
    // With a refresh token in hand, a renew is a `POST /oidc/token` with
    // `grant_type=refresh_token`: no redirect, no `/authorize`, no iframe, and
    // the address bar never moves. Without one it is a hidden iframe at
    // `/authorize?prompt=none` landing on `silent-callback.html`, and the
    // address bar still never moves — the difference is entirely in whether
    // lanyard's session cookie rides along.
    automaticSilentRenew: true,
    // The default is 60 seconds, and lanyard's access token *lives* 60 seconds
    // — so the "expiring" event would fire the instant the token arrives, or
    // never. Ten seconds gives a renew that happens while you watch.
    accessTokenExpiringNotificationTimeInSeconds: 10,
    // oidc-client-ts sends S256 by default for a public client; named here so
    // the thing Phase 4's criterion 2 is about is visible in the source.
    userStore: new oidc.WebStorageStateStore({ store: window.localStorage }),
  }
  const mgr = new oidc.UserManager(settings)

  const escape = (raw) => String(raw ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ))

  // **One page, three stacks.** The same `spikes/shared/page.html` that
  // `dotnet-web` and `php-web` read on the server, fetched and filled here —
  // through a symlink, so it really is the one file and not a copy that can
  // drift. Nothing is built and nothing is generated.
  const template = fetch('./shared/page.html').then((r) => r.text())

  async function show(user) {
    const claims = user ? user.profile : {}
    const rows = Object.entries(claims)
      .map(([k, v]) => `<tr><td class="k">${escape(k)}</td>` +
        `<td class="v">${escape(typeof v === 'object' ? JSON.stringify(v) : v)}</td></tr>`)
      .join('')

    const html = (await template)
      // `replaceAll`: the shared page names the app twice — in `<title>` and in
      // the `<h1>` — and a single `replace` filled the title this SPA throws
      // away and left the heading reading `{{APP}}`.
      .replaceAll('{{APP}}', 'node-spa')
      .replace('{{WHO}}', escape(user ? (user.profile.email ?? user.profile.sub) : ''))
      .replace('{{SIGNED_IN}}', user ? '' : 'hidden')
      .replace('{{SIGNED_OUT}}', user ? 'hidden' : '')
      .replace('{{CLAIM_ROWS}}', rows)

    // Only the <main> of the shared page; the surrounding shell is this
    // document's own, because a SPA replaces a fragment rather than reloading.
    // The <style> comes across with it, so the three pages look identical.
    const parsed = new DOMParser().parseFromString(html, 'text/html')
    document.getElementById('page').replaceChildren(
      parsed.querySelector('style'),
      parsed.querySelector('main')
    )

    // The shared page's three links are hrefs the two server-rendered stacks
    // follow. This one has no cookie to clear and no protected route to be
    // challenged from, so it maps them onto the three calls that mean the same
    // things — and that is the only stack-shaped difference on the page.
    intercept('login', () => mgr.signinRedirect())
    intercept('logout', () => mgr.signoutRedirect())
    intercept('logout-local', async () => { await mgr.removeUser(); show(null) })
  }

  function intercept(id, action) {
    const el = document.getElementById(id)
    if (el) el.onclick = (e) => { e.preventDefault(); action() }
  }

  ;(async () => {
    if (window.location.search.includes('code=')) {
      try {
        const user = await mgr.signinRedirectCallback()
        // Back to the bare page, minus `code`/`state` — but **keeping the
        // toggle**, which is what this page is running as.
        window.history.replaceState({}, '', iframeRenew ? '/?renew=iframe' : '/')
        show(user)
        return
      } catch (err) {
        document.getElementById('page').textContent = 'FAILED: ' + err
        return
      }
    }
    show(await mgr.getUser())
  })()

  // A renew that happened is worth being able to see without a network tab.
  mgr.events.addUserLoaded((user) => {
    console.log('[node-spa] access token renewed, expires in', user.expires_in, 'seconds')
    show(user)
  })
  // `err.message` rather than `err`: the message is `error_description` as
  // lanyard wrote it, and a console that prints the object prints "Error" in
  // one browser family and the whole stack in the other.
  mgr.events.addSilentRenewError((err) =>
    console.error('[node-spa] renew failed:', err.message ?? String(err)))
</script>
